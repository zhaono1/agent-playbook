name: agent-playbook-cli

on:
  push:
    paths:
      - "packages/agent-playbook/**"
      - ".github/workflows/agent-playbook-cli.yml"
  pull_request:
    paths:
      - "packages/agent-playbook/**"
      - ".github/workflows/agent-playbook-cli.yml"

permissions:
  contents: read

concurrency:
  group: cli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 18
          - os: ubuntu-latest
            node-version: 20
          - os: ubuntu-latest
            node-version: 22
          - os: macos-latest
            node-version: 20
          - os: windows-latest
            node-version: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Lint CLI
        working-directory: packages/agent-playbook
        run: npm run lint
      - name: Run CLI tests
        working-directory: packages/agent-playbook
        run: npm test
